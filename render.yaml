services:
  - type: web
    name: nitzotz
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.21.0
      - key: DATA_DIR
        value: /var/data
      - key: HEBCAL_GEONAME_ID
        value: 281184
      - key: OPENAI_API_KEY
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: ADMIN_SECRET
        sync: false
    disk:
      name: nitzotz-data
      mountPath: /var/data
      sizeGB: 1
